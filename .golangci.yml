run:
  timeout: 5m

linters:
  enable:
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose

linters-settings:
  errcheck:
    check-type-assertions: false
    check-blank: false

issues:
  exclude-dirs:
    - web/dist
    - web/frontend
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - staticcheck
  max-issues-per-linter: 0
  max-same-issues: 0
