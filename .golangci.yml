run:
  timeout: 5m


linters:
  default: none
  enable:
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose

  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false

  exclusions:
    rules:
      # Exclude some linters from running on tests files
      - path: _test\.go
        linters:
          - gosec
          - staticcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
