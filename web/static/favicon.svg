<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>
  <!-- Clipboard outline -->
  <rect x="16" y="12" width="32" height="44" rx="4" fill="white" opacity="0.15"/>
  <rect x="20" y="16" width="24" height="36" rx="2" fill="white"/>
  <!-- Clipboard clip -->
  <rect x="26" y="10" width="12" height="6" rx="2" fill="white" stroke="url(#bg)" stroke-width="1.5"/>
  <!-- Checkmark -->
  <polyline points="24,34 30,40 42,28" fill="none" stroke="#667eea" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
