version: "2"
sql:
  - schema: ".init/01-init.sql"
    queries: "internal/db/query"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "database/sql"
        emit_empty_slices: true
        emit_interface: true
        emit_json_tags: true
        json_tags_case_style: "camel"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamp"
            go_type: "time.Time"
